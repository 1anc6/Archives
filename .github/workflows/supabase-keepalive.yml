# Free Supabase projects are paused after about a week with no activity.
# This reads one review a day so the reviews database stays awake.
# The URL and public (anon) key come from public/data/site.json; the anon key
# is already public on the website, so no secrets are needed.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC (11:47 in India)
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: public/data/site.json
          sparse-checkout-cone-mode: false
      - name: Read one review
        run: |
          url=$(jq -r '.supabase.url // empty' public/data/site.json)
          key=$(jq -r '.supabase.anonKey // empty' public/data/site.json)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Supabase isn't set up in site.json yet; nothing to do."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$url/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: $key" -H "Authorization: Bearer $key")
          echo "Supabase answered $code"
          test "$code" = "200"
